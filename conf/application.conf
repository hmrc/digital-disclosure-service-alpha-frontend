include "frontend.conf"

appName = "digital-disclosure-service-alpha-frontend"
play.http.router = prod.Routes

play.filters.enabled += play.filters.csp.CSPFilter

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

# Binds AuthConnector for AuthorisedFunctions (payment origins are authenticated journeys)
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"

# Custom error handler
play.http.errorHandler = "uk.gov.hmrc.digitaldisclosureservicealphafrontend.config.ErrorHandler"

# Play Modules
play.modules.enabled += "uk.gov.hmrc.digitaldisclosureservicealphafrontend.Module"

upscan {
  max-file-size = 10485760  # 10MB in bytes
}

payments {
  # SPJ (Start Payment Journey) endpoint on pay-api. The PoC reuses an existing
  # service origin that accepts a caller-supplied charge reference, amount and
  # return URLs (so the user types nothing on pay-frontend) — the same shape a
  # production DDS integration needs. Production would point this at a dedicated
  # Dds origin endpoint owned by the OPS team.
  start-journey-path = "/pay-api/economic-crime-levy/journey/start"

  # Charge-reference notification endpoint. Locally this points at the
  # payments-stubs DES stub, which models the real DES/ETMP contract. In
  # production this notification is owned by OPS or routed via HIP to ETMP.
  charge-notification-path = "/cross-regime/payments/card/notification"
  charge-notification-tax-type = "DDS"

  # Local dev only: on startup, register the internal-auth token that
  # card-payment-frontend uses to call card-payment (so teammates do not need
  # to curl test-only/token manually). Not part of the DDS integration.
  seed-card-payment-internal-auth-on-start = true
  card-payment-internal-auth-token = "123456"
  card-payment-internal-auth-principal = "card-payment-frontend"
}

# Where to redirect a user with no active session. Locally this is the
# auth-login-stub ("authority wizard"); the payment origins are authenticated
# journeys, so pay-frontend requires a signed-in user.
auth {
  sign-in-url = "http://localhost:9949/auth-login-stub/gg-sign-in"
  # Individual auth PoC: BAS gateway stub with accountType=individual for the IV uplift chain
  individual-sign-in-url = "http://localhost:9099/bas-gateway/sign-in"
}

external-urls {
  # Stop IDENTITY_VERIFICATION_FRONTEND and start IDENTITY_VERIFICATION_STUB (port 9948) locally
  iv-uplift = "http://localhost:9948/iv-stub/uplift"
  iv-journey-status = "http://localhost:9948/iv-stub/mdtp/journey/journeyId"
}

individual-poc {
  iv-origin = "digital-disclosure-service-alpha-frontend"
  target-confidence-level = 200
  # Stand-in until a DDS regime enrolment key exists in EACD/ETMP
  stand-in-service-key = "HMRC-MTD-IT"
  stand-in-identifier-key = "MTDITID"
}

microservice {
  services {
    auth {
      protocol = http
      host = localhost
      port = 8500
    }
    internal-auth {
      protocol = http
      host = localhost
      port = 8470
    }
    contact-frontend {
      protocol = http
      host = localhost
      port = 9250
    }
    dds-frontend {
      protocol = http
      host = localhost
      port = 9000
    }
    upscan-initiate {
      protocol = http
      host = localhost
      port = 9570
    }
    pay-api {
      protocol = http
      host = localhost
      port = 9057
    }
    # Where DDS sends the charge-reference notification. Locally the
    # payments-stubs service (which exposes the DES stub) listens on 9975.
    charge-notification {
      protocol = http
      host = localhost
      port = 9975
    }
    agents-external-stubs {
      protocol = http
      host = localhost
      port = 9009
    }
  }
}

mongodb {
  uri = "mongodb://localhost:27017/digital-disclosure-service-alpha-frontend"
}

play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"

play.i18n.langCookieHttpOnly: "true"

# Change this value to true to enable Welsh translations to be loaded from messages.cy, and to display the language toggle
features.welsh-language-support = false

# Individual auth + IV uplift + NINO PoC (see README — Individual auth section)
features.individual-auth-poc = true

# Replace play.i18n.langs with the commented out line below when your service has been fully translated into Welsh
# to enable Welsh translations for all content, including the standard headers and footers.
# play.i18n.langs = ["en", "cy"]
play.i18n.langs = ["en"]

# To integrate with tracking-consent-frontend, uncomment and update the
# gtm.container property below to be one of a, b, c, d, e, f or sdes
#tracking-consent-frontend {
#  gtm.container = "<INSERT YOUR GTM CONTAINER LETTER HERE>"
#}

play-frontend-hmrc {
    useRebrand = true
}

